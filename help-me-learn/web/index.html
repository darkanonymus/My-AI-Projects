<style>
/* ============ DESIGN TOKENS — dark-first "study console" ============ */
:root {
  /* exponential ease-out: deliberate curve for hover/tap feedback (not the browser default `ease`) */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

  /* ---- type families (theme-independent; live here so light theme inherits them too) ---- */
  --font-sans:    'IBM Plex Sans', system-ui, sans-serif;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;  /* editorial signature */
  --font-serif:   var(--font-display);   /* back-compat: h1–h4 already reference --font-serif */
  --font-mono:    'JetBrains Mono', ui-monospace, monospace;

  /* ---- type scale (values chosen to match the literals already in use, so swaps are 1:1) ---- */
  --fs-caption: 11px;
  --fs-micro:   12.5px;
  --fs-small:   13.5px;
  --fs-body:    15px;
  --fs-body-lg: 16.5px;
  --fs-h4:      18px;
  --fs-h3:      21px;
  --fs-h2:      24px;
  --fs-h1:      30px;
  --fs-display: clamp(36px, 5.2vw, 56px);   /* the one signature moment */

  /* ---- spacing scale (4px base) ---- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 32px;
  --space-8: 44px;
  --space-9: 64px;

  /* ---- line-heights ---- */
  --lh-tight: 1.12;
  --lh-snug:  1.35;
  --lh-body:  1.62;

  /* ---- layout ---- */
  --sidebar-w: 232px;
}
[data-theme="dark"] {
  --paper:        oklch(0.169 0.013 264);   /* app background */
  --paper-edge:   oklch(0.195 0.014 264);
  --surface:      oklch(0.224 0.017 264);   /* cards */
  --surface-2:    oklch(0.268 0.019 264);   /* inputs / elevated */
  --surface-3:    oklch(0.315 0.021 264);
  --ink:          oklch(0.955 0.008 250);
  --ink-soft:     oklch(0.760 0.014 255);
  --ink-faint:    oklch(0.585 0.016 258);
  --line:         oklch(0.312 0.018 264);
  --line-strong:  oklch(0.392 0.020 264);
  --accent:       oklch(0.685 0.150 256);
  --accent-deep:  oklch(0.790 0.120 256);
  --accent-soft:  oklch(0.300 0.070 258);
  --accent-line:  oklch(0.420 0.090 258);
  --accent-2:     oklch(0.760 0.120 205);
  --ochre:        oklch(0.790 0.130 72);
  --ochre-deep:   oklch(0.860 0.110 75);
  --ochre-soft:   oklch(0.320 0.060 70);
  --ochre-line:   oklch(0.440 0.080 70);
  --good:         oklch(0.760 0.140 158);
  --good-soft:    oklch(0.320 0.060 158);
  --bad:          oklch(0.700 0.165 25);
  --bad-soft:     oklch(0.330 0.070 25);
  --grad-accent:  linear-gradient(135deg, oklch(0.700 0.155 262), oklch(0.640 0.150 290));
  --glow-accent:  0 0 0 1px oklch(0.685 0.150 256 / 0.30), 0 8px 24px oklch(0.685 0.150 256 / 0.28);
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.30), 0 1px 1px oklch(0 0 0 / 0.22);
  --shadow-hover: 0 4px 8px oklch(0 0 0 / 0.34), 0 1px 3px oklch(0 0 0 / 0.26);
  --shadow-md: 0 6px 22px oklch(0 0 0 / 0.40), 0 2px 6px oklch(0 0 0 / 0.28);
  --shadow-lg: 0 26px 70px oklch(0 0 0 / 0.55), 0 8px 22px oklch(0 0 0 / 0.40);
  --radius: 16px; --radius-sm: 10px;
}
[data-theme="light"] {
  --paper:        oklch(0.971 0.006 258);
  --paper-edge:   oklch(0.945 0.008 258);
  --surface:      oklch(0.999 0.002 258);
  --surface-2:    oklch(0.958 0.008 258);
  --surface-3:    oklch(0.928 0.010 258);
  --ink:          oklch(0.255 0.024 262);
  --ink-soft:     oklch(0.448 0.022 260);
  --ink-faint:    oklch(0.520 0.018 260);   /* darkened from 0.600: was 3.9:1 on --surface, now ~5.5:1 (WCAG AA) */
  --line:         oklch(0.905 0.012 260);
  --line-strong:  oklch(0.835 0.016 260);
  --accent:       oklch(0.520 0.165 258);
  --accent-deep:  oklch(0.430 0.160 258);
  --accent-soft:  oklch(0.945 0.030 258);
  --accent-line:  oklch(0.850 0.055 258);
  --accent-2:     oklch(0.560 0.120 205);
  --ochre:        oklch(0.560 0.120 66);
  --ochre-deep:   oklch(0.470 0.115 66);
  --ochre-soft:   oklch(0.952 0.036 70);
  --ochre-line:   oklch(0.860 0.065 70);
  --good:         oklch(0.510 0.120 158);
  --good-soft:    oklch(0.948 0.038 158);
  --bad:          oklch(0.540 0.155 27);
  --bad-soft:     oklch(0.955 0.030 27);
  --grad-accent:  linear-gradient(135deg, oklch(0.530 0.175 262), oklch(0.500 0.170 292));
  --glow-accent:  0 0 0 1px oklch(0.520 0.165 258 / 0.18), 0 10px 26px oklch(0.520 0.165 258 / 0.22);
  --shadow-sm: 0 1px 2px oklch(0.30 0.03 262 / 0.07), 0 1px 1px oklch(0.30 0.03 262 / 0.05);
  --shadow-hover: 0 4px 8px oklch(0.30 0.03 262 / 0.13), 0 1px 3px oklch(0.30 0.03 262 / 0.08);
  --shadow-md: 0 6px 20px oklch(0.30 0.03 262 / 0.10), 0 2px 6px oklch(0.30 0.03 262 / 0.06);
  --shadow-lg: 0 26px 64px oklch(0.30 0.03 262 / 0.16), 0 8px 20px oklch(0.30 0.03 262 / 0.09);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background-color: var(--paper); color: var(--ink);
  font-family: var(--font-sans); font-size: 17px; line-height: 1.62;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
/* ambient tech backdrop */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(60% 50% at 14% -6%, oklch(0.685 0.150 256 / 0.16), transparent 70%),
    radial-gradient(50% 45% at 100% 4%, oklch(0.760 0.120 205 / 0.10), transparent 70%);
}
[data-theme="light"] body::before {
  background:
    radial-gradient(60% 50% at 14% -8%, oklch(0.520 0.165 258 / 0.10), transparent 70%),
    radial-gradient(50% 45% at 100% 2%, oklch(0.560 0.120 205 / 0.07), transparent 70%);
}
::selection { background: var(--accent-soft); color: var(--ink); }

h1,h2,h3,h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.18; letter-spacing: -0.005em; font-optical-sizing: auto; }
a { color: var(--accent-deep); }
.mono { font-family: var(--font-mono); }
button { font-family: inherit; cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 5px; }

* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 20px; border: 3px solid transparent; background-clip: padding-box; }

/* ============ SHELL : sidebar + content ============ */
.shell { position: relative; z-index: 1; display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w); flex: none; position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 4px; padding: 16px 12px;
  background: linear-gradient(180deg, var(--paper-edge), var(--paper));
  border-right: 1px solid var(--line);
}
.side-brand { display: flex; align-items: center; gap: 12px; padding: 6px 8px 16px; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 13px; flex: none;
  background: var(--ochre-soft); color: var(--ochre-deep); border: 1px solid var(--ochre-line);
  display: grid; place-items: center;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.12; }
.brand-title { font-family: var(--font-serif); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
.brand-sub { font-family: var(--font-display); font-style: italic; font-size: 12px; color: var(--ink-faint); letter-spacing: 0; margin-top: 3px; }

.side-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); padding: 6px 12px 4px; }

.nav-item {
  appearance: none; border: 1px solid transparent; background: none; width: 100%;
  display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-radius: 12px;
  font-size: 14.5px; font-weight: 500; color: var(--ink-soft); text-align: left;
  position: relative;
  transition: background-color 0.18s var(--ease-out), color 0.18s var(--ease-out), border-color 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out);
}
.nav-item:hover { background: var(--surface); color: var(--ink); }
.nav-item .nav-ico { flex: none; opacity: 0.85; display: grid; place-items: center; }
.nav-item .nav-label { flex: 1; }
.nav-item .nav-badge {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: 999px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-soft);
}
/* active = a single restrained signal: soft fill + accent text + a 3px inner left rail
   (no edge-bleed, no glow, no double border) */
.nav-item[aria-selected="true"] {
  background: var(--accent-soft); color: var(--accent-deep);
  box-shadow: inset 3px 0 0 var(--accent);
}
.nav-item[aria-selected="true"] .nav-ico { opacity: 1; color: var(--accent); }
.nav-item[aria-selected="true"] .nav-badge { background: var(--accent); color: #fff; }

.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.gen-chip {
  display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 11px;
  background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-soft);
}
.theme-btn {
  display: flex; align-items: center; gap: 10px; padding: 10px 13px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
  font-size: 13.5px; font-weight: 500;
  transition: background-color 0.18s var(--ease-out), color 0.18s var(--ease-out), border-color 0.18s var(--ease-out);
}
.theme-btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line-strong); }

.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mobile-top { display: none; }
.content-inner { width: 100%; max-width: 940px; margin: 0 auto; padding: 40px 32px 96px; }

/* ============ PRIMITIVES ============ */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
.btn {
  appearance: none; border: 1px solid var(--line); border-radius: 11px;
  padding: 11px 18px; font-size: 15px; font-weight: 600; font-family: var(--font-sans);
  display: inline-flex; align-items: center; gap: 9px;
  background: var(--surface-2); color: var(--ink);
  transition: background-color 0.18s var(--ease-out), border-color 0.18s var(--ease-out), color 0.18s var(--ease-out), transform 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out), filter 0.18s var(--ease-out);
}
.btn:hover { border-color: var(--line-strong); background: var(--surface-3); transform: translateY(-1px); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--grad-accent); color: #fff; border-color: transparent; box-shadow: var(--glow-accent); }
.btn-primary:hover { filter: brightness(1.06); box-shadow: var(--glow-accent); transform: translateY(-1px); }
.btn:active, .btn-primary:active { transform: translateY(0) scale(0.97); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.btn-sm { padding: 7px 12px; font-size: 13.5px; border-radius: 9px; }

.tag {
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono);
  font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 8px;
  border: 1px solid var(--line); color: var(--ink-soft); background: var(--surface-2); letter-spacing: 0.01em;
}
.tag-accent { color: var(--accent-deep); background: var(--accent-soft); border-color: var(--accent-line); }
.tag-ochre  { color: var(--ochre-deep); background: var(--ochre-soft); border-color: var(--ochre-line); }
.tag-good   { color: var(--good); background: var(--good-soft); border-color: color-mix(in oklch, var(--good) 38%, transparent); }
.tag-mono   { font-family: var(--font-mono); }

.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid color-mix(in oklch, currentColor 25%, transparent); border-top-color: currentColor; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.progress-track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.progress-fill {
  height: 100%; width: 100%; border-radius: 999px; background: var(--grad-accent);
  transform-origin: 0% 50%; transform: scaleX(0);
  transition: transform 0.5s cubic-bezier(.3,.9,.3,1);
}

/* ============ PROSE / LESSON ============ */
.prose { font-size: 16.5px; line-height: 1.74; color: var(--ink); }
.prose p { margin: 0 0 0.85em; }
.prose p:last-child { margin-bottom: 0; }
.prose strong { font-weight: 600; color: var(--ink); }
.prose em { font-style: italic; }
.prose ul, .prose ol { margin: 0.4em 0 0.95em; padding-left: 1.4em; }
.prose li { margin: 0.32em 0; padding-left: 0.2em; }
.prose ul li::marker { color: var(--accent); }
.prose ol li::marker { color: var(--accent); font-weight: 600; }
.prose code { font-family: var(--font-mono); font-size: 0.85em; background: var(--surface-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
.prose .term { font-family: var(--font-mono); font-weight: 500; font-size: 0.88em; color: var(--accent-deep); background: var(--accent-soft); border-bottom: 1.5px solid var(--accent-line); padding: 0 4px; border-radius: 4px; }
.prose h4 { font-size: 1.06em; margin: 1.1em 0 0.4em; color: var(--ink); }
.katex { font-size: 1.04em; }
.math-block { margin: 0.9em 0; padding: 4px 0; overflow-x: auto; overflow-y: hidden; }

.complement { margin: 0.95em 0; padding: 13px 16px; border: 1px solid var(--ochre-line); background: var(--ochre-soft); border-radius: var(--radius-sm); font-size: 15.5px; }
.complement-label { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 5px; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ochre-deep); }
.complement p:last-child { margin-bottom: 0; }

.insertion-card { margin: 0.95em 0; padding: 14px 17px; border: 1px solid color-mix(in oklch, var(--good) 35%, transparent); background: var(--good-soft); border-radius: var(--radius-sm); font-size: 15.5px; }
.insertion-card-label { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 7px; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--good); }
.insertion-card .anchor-quote { font-size: 13px; font-style: italic; color: var(--ink-soft); border-left: 2px solid color-mix(in oklch, var(--good) 45%, transparent); padding-left: 10px; margin-bottom: 9px; }
.insertion-card p:last-child { margin-bottom: 0; }

.hidden-passage { margin: 0.95em 0; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-2); overflow: hidden; }
.hidden-passage-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 11px 16px; }
.hidden-passage-content { display: grid; grid-template-rows: 0fr; opacity: 0; border-top: 1px solid transparent; transition: grid-template-rows 240ms var(--ease-out), opacity 160ms var(--ease-out), border-color 240ms var(--ease-out); }
.hidden-passage-content[data-open="true"] { grid-template-rows: 1fr; opacity: 1; border-top-color: var(--line); }
.hidden-passage-content-inner { overflow: hidden; min-height: 0; padding: 12px 16px 14px; }
.hidden-passage-content-inner p:last-child { margin-bottom: 0; }

@keyframes popoverIn { from { opacity: 0; transform: scale(0.95) translateY(4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.selection-toolbar, .selection-panel { transform-origin: center bottom; animation: popoverIn 160ms var(--ease-out) both; }
.selection-toolbar { display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: 0 8px 28px oklch(0 0 0 / 0.22); }
.selection-panel { width: 320px; max-width: calc(100vw - 32px); max-height: min(56vh, 460px); display: flex; flex-direction: column; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: 0 8px 28px oklch(0 0 0 / 0.22); }
.selection-panel-scroll { overflow-y: auto; min-height: 0; }
.selection-panel-actions { flex: none; display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.selection-panel .prose:last-child p:last-child { margin-bottom: 0; }
.selection-input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; font-family: var(--font-sans); font-size: 14px; background: var(--paper); color: var(--ink); outline: none; }
.selection-input:focus { border-color: var(--accent-line); }

.figure { margin: 1em 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 10px 12px; overflow: hidden; }
.figure svg { display: block; width: 100%; height: auto; }
.figure-fallback { padding: 18px; text-align: center; }

.fade-in { animation: fadeIn 0.45s var(--ease-out) both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ============ SCROLL REVEAL (IntersectionObserver) ============
   Entrance-on-scroll, driven by the useReveal() hook which flips
   data-revealed once the element enters the viewport. */
.reveal {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.55s var(--ease-out), transform 0.55s var(--ease-out);
}
.reveal[data-revealed="true"] { opacity: 1; transform: none; }

/* ============ EDITORIAL TYPE & LAYOUT (token-driven — replaces inline styles) ============ */
.page-head { margin-bottom: var(--space-7); }
.kicker {
  display: inline-block; margin-bottom: var(--space-3);
  font-family: var(--font-mono); font-size: var(--fs-caption); font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-deep);
}
.page-title { margin: 0; font-size: var(--fs-h1); line-height: var(--lh-tight); }
.page-lede {
  margin: var(--space-3) 0 0; max-width: 60ch;
  font-size: var(--fs-body-lg); line-height: var(--lh-snug); color: var(--ink-soft);
}

/* the one signature moment — the lesson entry hero */
.page-head--hero { margin-bottom: var(--space-8); }
.page-head--hero .page-title {
  font-size: var(--fs-display); line-height: 1.02; letter-spacing: -0.02em; font-weight: 600;
}
.page-head--hero .page-lede { font-size: var(--fs-h4); margin-top: var(--space-4); }

/* empty-state block */
.empty-state { padding: var(--space-8) var(--space-7); text-align: center; max-width: 520px; margin: var(--space-2) auto; }
.empty-icon {
  width: 56px; height: 56px; border-radius: var(--radius); margin: 0 auto var(--space-4);
  display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-deep);
}
.empty-title { margin: 0 0 var(--space-2); font-size: var(--fs-h3); }
.empty-body { font-size: var(--fs-body-lg); line-height: var(--lh-body); color: var(--ink-soft); }

/* feature grid on the lesson home */
.feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); margin-top: var(--space-6); }
.feature-card { padding: var(--space-5); }
.feature-card .feature-ico { color: var(--accent); }
.feature-card h3 { margin: var(--space-3) 0 var(--space-1); font-size: var(--fs-body-lg); }
.feature-card p { margin: 0; font-size: var(--fs-small); line-height: var(--lh-snug); color: var(--ink-soft); }

/* lesson header block */
.lesson-head { margin-bottom: var(--space-5); }
.lesson-meta { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
.lesson-title-row { display: flex; align-items: flex-start; gap: var(--space-4); flex-wrap: wrap; }
.lesson-title { margin: 0 0 var(--space-2); font-size: var(--fs-h1); line-height: var(--lh-tight); flex: 1; min-width: 220px; }
.lesson-theme { margin: 0; font-size: var(--fs-body-lg); color: var(--ink-soft); max-width: 680px; }

/* ============ SECTION STATUS INDICATOR ============ */
.section-card {
  position: relative; overflow: hidden;
  transition: box-shadow 0.25s var(--ease-out), border-color 0.25s var(--ease-out);
}
.section-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  transition: background 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out);
  border-radius: 3px 0 0 3px;
}
.section-card[data-status="pending"]::before  { background: var(--line); }
.section-card[data-status="done"]::before     { background: var(--accent); box-shadow: 0 0 14px oklch(0.685 0.150 256 / 0.60); }
.section-card[data-status="error"]::before    { background: var(--bad); }
.section-card[data-status="loading"]::before  {
  background: linear-gradient(180deg, transparent 0%, var(--accent) 50%, transparent 100%);
  background-size: 100% 250%;
  animation: flow-down 1.5s ease-in-out infinite;
}
.section-card[data-status="done"] { border-color: color-mix(in oklch, var(--accent) 22%, var(--line)); }
.section-card[data-status="done"] { background: color-mix(in oklch, var(--accent-soft) 30%, var(--surface)); }
@keyframes flow-down {
  0%   { background-position: 0 -100%; }
  100% { background-position: 0 200%; }
}

/* ============ GENERATION TIMELINE ============ */
.gen-timeline {
  padding: 11px 13px; border-radius: 12px; background: var(--surface);
  border: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px;
  max-height: 260px; overflow-y: auto; overflow-x: hidden;
}
.gen-timeline-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 7px; padding-bottom: 7px;
  border-bottom: 1px solid var(--line);
}
.gen-timeline-label {
  font-size: 11.5px; font-weight: 600; font-family: var(--font-mono); color: var(--ink-soft);
  letter-spacing: 0.04em; flex: 1;
}
.gen-timeline-count {
  font-size: 11px; font-family: var(--font-mono); color: var(--accent-deep);
  background: var(--accent-soft); padding: 1px 7px; border-radius: 99px;
}
.gen-dot {
  width: 7px; height: 7px; border-radius: 99px; flex: none;
  transition: background 0.35s var(--ease-out), box-shadow 0.35s var(--ease-out);
}
.gen-dot--pending { background: var(--line); }
.gen-dot--loading { background: var(--accent); animation: pulse-glow 1.3s ease-in-out infinite; }
.gen-dot--done    { background: var(--good); }
.gen-dot--error   { background: var(--bad); }
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 0 oklch(0.685 0.150 256 / 0.55); }
  50%       { box-shadow: 0 0 0 4px oklch(0.685 0.150 256 / 0); }
}
.gen-timeline-row {
  display: flex; align-items: center; gap: 8px; padding: 2px 0;
  transition: opacity 0.3s var(--ease-out);
}
.gen-timeline-row[data-done="true"] { opacity: 0.65; }
.gen-timeline-name {
  font-size: 11px; font-family: var(--font-mono); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; transition: color 0.3s var(--ease-out);
}

/* ============ CARD POLISH ============ */
.course-card-lift {
  transition: box-shadow 0.22s var(--ease-out), transform 0.22s var(--ease-out);
}
.course-card-lift:hover {
  /* single signal: a tight (<=8px blur) lift shadow — not paired with a border-color change */
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}

/* ============ PROGRESS BAR GLOW ============ */
.progress-fill {
  box-shadow: 0 0 8px oklch(0.685 0.150 256 / 0.35);
}


/* ============ RESPONSIVE ============ */
@media (max-width: 880px) {
  .sidebar {
    position: fixed; bottom: 0; left: 0; right: 0; top: auto; width: auto; height: auto;
    flex-direction: row; gap: 4px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    border-right: none; border-top: 1px solid var(--line); z-index: 50;
    background: color-mix(in oklch, var(--paper) 92%, transparent); backdrop-filter: blur(14px);
    justify-content: space-around;
  }
  .side-brand, .side-label, .side-foot { display: none; }
  .nav-item { flex-direction: column; gap: 4px; padding: 7px 6px; font-size: 10.5px; border-radius: 12px; flex: 1; align-items: center; }
  .nav-item .nav-label { flex: none; }
  .nav-item .nav-badge { position: absolute; top: 2px; right: 50%; margin-right: -22px; transform: scale(0.82); }
  .nav-item[aria-selected="true"]::before { display: none; }
  .mobile-top {
    display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 40;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    background: color-mix(in oklch, var(--paper) 88%, transparent); backdrop-filter: blur(14px);
  }
  .mobile-top .brand-text { margin-right: auto; }
  .content-inner { padding: 24px 16px 110px; }
}
@media (max-width: 460px) {
  body { font-size: 16px; }
}

/* ============ REDUCED MOTION ============
   Collapse decorative entrance/hover motion to an instant state.
   Live-progress indicators (spinner, generation dot, section loading rail,
   shimmer placeholder) keep a slowed, steady animation: they communicate an
   in-progress async state, not decoration — killing them removes the only
   sign that something is happening. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .fade-in { opacity: 1; transform: none; }
  .reveal { opacity: 1 !important; transform: none !important; }
  .btn:hover, .btn-primary:hover, .course-card-lift:hover, .nav-item:hover { transform: none; }
  .selection-toolbar, .selection-panel { animation: none; opacity: 1; transform: none; }
  .hidden-passage-content[data-open="true"] { grid-template-rows: 1fr; }

  .spinner { animation: spin 1.1s linear infinite !important; }
  .gen-dot--loading { animation: pulse-glow 2.2s ease-in-out infinite !important; }
  .section-card[data-status="loading"]::before { animation: flow-down 2.6s ease-in-out infinite !important; }
  [style*="shimmer"] { animation-duration: 2.6s !important; }
}

/* utility */
.row { display: flex; align-items: center; gap: 12px; }
.col { display: flex; flex-direction: column; }
.muted { color: var(--ink-faint); }
.soft { color: var(--ink-soft); }
.center { text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.icon-btn { width: 40px; height: 40px; border-radius: 11px; flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); display: grid; place-items: center; transition: background-color 0.18s var(--ease-out), color 0.18s var(--ease-out), transform 0.16s var(--ease-out); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn:active { transform: scale(0.95); }

/* ============ SIDEBAR COLLAPSE ============ */
.nav-collapse {
  margin-left: auto; width: 30px; height: 30px; flex: none; border: none; background: none;
  color: var(--ink-faint); border-radius: 8px; display: grid; place-items: center;
  transition: background-color 0.16s var(--ease-out), color 0.16s var(--ease-out);
}
.nav-collapse:hover { background: var(--surface-2); color: var(--ink); }
.nav-reopen {
  position: fixed; top: 16px; left: 16px; z-index: 60; width: 38px; height: 38px;
  display: none; place-items: center; border: 1px solid var(--line); border-radius: 10px;
  background: color-mix(in oklch, var(--surface) 90%, transparent); backdrop-filter: blur(8px);
  color: var(--ink-soft); box-shadow: var(--shadow-sm);
  transition: color 0.16s var(--ease-out), transform 0.16s var(--ease-out), background-color 0.16s var(--ease-out);
}
.nav-reopen:hover { color: var(--ink); transform: translateY(-1px); }

@media (min-width: 881px) {
  .sidebar { transition: margin-left 0.3s var(--ease-out); }
  .shell[data-nav="closed"] .sidebar { margin-left: calc(-1 * var(--sidebar-w)); }
  .shell[data-nav="closed"] .nav-reopen { display: grid; }
}
@media (max-width: 880px) {
  .nav-collapse { display: none; }
}

/* ============ COMPONENT CLASSES (token-driven — replace repeated inline style objects) ============ */

/* modal scaffolding */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200; padding: var(--space-5);
  display: grid; place-items: center;
  background: oklch(0.12 0.02 264 / 0.62); backdrop-filter: blur(4px);
}
.modal-panel { width: min(600px, 100%); padding: 0; overflow: hidden; box-shadow: var(--shadow-lg); }
.modal-panel--tall { max-height: 88vh; overflow-y: auto; }
.modal-body { padding: var(--space-6); }
.modal-head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); }
.modal-head h2 { margin: 0; font-size: var(--fs-h2); }
.spacer { flex: 1; }
.accent-bar { height: 5px; background: var(--grad-accent); }
.tile-icon {
  width: 38px; height: 38px; border-radius: var(--radius-sm); flex: none;
  display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-deep);
}

/* selectable option — the most-repeated "active accent" button */
.option {
  width: 100%; text-align: left; padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm);
  cursor: pointer; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
  transition: border-color 0.14s var(--ease-out), background-color 0.14s var(--ease-out), color 0.14s var(--ease-out);
}
.option:disabled { opacity: 0.55; cursor: not-allowed; }
.option[data-active="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); }
.option[data-tone="good"][data-active="true"] { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.option-title { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-body); }
.option-sub { font-size: var(--fs-micro); margin-top: var(--space-1); line-height: 1.45; color: var(--ink-soft); }
.option[data-active="true"] .option-sub { color: var(--accent-deep); }
.chip-option {
  padding: var(--space-2) var(--space-4); border-radius: 9px; cursor: pointer; font-size: var(--fs-body);
  border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
  transition: border-color 0.14s var(--ease-out), background-color 0.14s var(--ease-out), color 0.14s var(--ease-out);
}
.chip-option[data-active="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); font-weight: 700; }
.chip-option[data-tone="good"][data-active="true"] { border-color: var(--good); background: var(--good-soft); color: var(--good); }

/* form fields */
.field {
  width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: var(--space-3) var(--space-4); font-family: var(--font-sans); font-size: var(--fs-body);
  line-height: var(--lh-body); background: var(--paper); color: var(--ink); outline: none;
}
.field:focus { border-color: var(--accent-line); }
.field--mono { font-family: var(--font-mono); font-size: var(--fs-small); }
.field-label {
  display: block; margin-bottom: var(--space-2); font-family: var(--font-mono);
  font-size: var(--fs-caption); font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--ink-faint);
}
.hint { font-size: var(--fs-micro); line-height: 1.55; color: var(--ink-faint); }
.hint--warn { color: var(--ochre-deep); }

/* inline notice / banner */
.notice {
  display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap;
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); font-size: var(--fs-small);
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft);
}
.notice--accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-deep); }
.notice--ochre { background: var(--ochre-soft); border-color: var(--ochre-line); color: var(--ochre-deep); align-items: flex-start; }

/* flashcard face label */
.card-face-label { font-size: var(--fs-caption); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-deep); }

/* stat block (big serif number + caption) */
.stat-n { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-h2); line-height: 1; }
.stat-label { font-size: var(--fs-micro); margin-top: var(--space-1); color: var(--ink-faint); }

/* form section divider */
.form-section { margin-bottom: var(--space-6); padding-bottom: var(--space-6); border-bottom: 1px solid var(--line); }

/* card used as a centered inline message (loading / error) */
.card-msg { padding: var(--space-6); text-align: center; }

/* labelled progress meter head */
.meter-head { display: flex; justify-content: space-between; font-size: var(--fs-micro); margin-bottom: var(--space-1); }

/* ============ READ-ALOUD (text-to-speech) ============ */
.reading-now { background: var(--accent-soft); border-radius: 6px; box-shadow: inset 3px 0 0 var(--accent); transition: background-color 0.25s var(--ease-out); }
.section-card.reading-section { border-color: color-mix(in oklch, var(--accent) 32%, var(--line)); }

.read-bar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 70;
  width: min(720px, calc(100vw - 28px));
  display: flex; align-items: center; gap: var(--space-2);
  padding: 9px 11px; border-radius: 18px;
  background: color-mix(in oklch, var(--surface) 86%, transparent); backdrop-filter: blur(16px);
  border: 1px solid var(--line-strong); box-shadow: var(--shadow-lg);
  transition: transform 0.32s var(--ease-out), opacity 0.25s var(--ease-out);
  animation: barIn 0.28s var(--ease-out);
}
@keyframes barIn { from { opacity: 0; } to { opacity: 1; } }
.read-bar[data-collapsed="true"] { transform: translate(-50%, 170%); opacity: 0; pointer-events: none; }
.read-fab {
  position: fixed; right: 20px; bottom: 22px; z-index: 70; width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer; border: none;
  background: var(--grad-accent); color: #fff; box-shadow: var(--glow-accent);
  transition: filter 0.16s var(--ease-out), transform 0.16s var(--ease-out);
}
.read-fab:hover { filter: brightness(1.06); transform: translateY(-2px); }
@media (max-width: 880px) { .read-fab { bottom: calc(82px + env(safe-area-inset-bottom)); right: 14px; } }
@media (max-width: 880px) { .read-bar { bottom: calc(74px + env(safe-area-inset-bottom)); width: calc(100vw - 20px); } }
.read-play {
  flex: none; width: 42px; height: 42px; border-radius: 12px; border: none;
  display: grid; place-items: center; cursor: pointer;
  background: var(--grad-accent); color: #fff; box-shadow: var(--glow-accent);
  transition: filter 0.16s var(--ease-out), transform 0.16s var(--ease-out);
}
.read-play:hover { filter: brightness(1.06); transform: translateY(-1px); }
.read-play:active { transform: scale(0.96); }
.read-caption { flex: 1; min-width: 0; font-size: var(--fs-small); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.read-rate { font-family: var(--font-mono); font-size: var(--fs-small); font-weight: 600; width: auto; min-width: 44px; padding: 0 8px; }
.read-voice {
  flex: none; max-width: 130px; font-family: var(--font-sans); font-size: var(--fs-small);
  padding: 7px 9px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft); outline: none; cursor: pointer;
}
.read-voice:focus { border-color: var(--accent-line); }
.read-toc {
  position: absolute; bottom: calc(100% + 10px); left: 0; width: 290px; max-height: 50vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow-lg); padding: var(--space-2);
}
.read-toc button {
  display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; border: none; background: none;
  color: var(--ink-soft); font-size: var(--fs-small); line-height: 1.4; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background-color 0.14s var(--ease-out), color 0.14s var(--ease-out);
}
.read-toc button:hover { background: var(--surface-2); color: var(--ink); }
.read-toc button[data-cur="true"] { background: var(--accent-soft); color: var(--accent-deep); }
@media (max-width: 880px) { .read-voice { max-width: 92px; } .read-rate { min-width: 40px; } }

/* voice Q&A (Phase A) */
.read-mic[data-on="true"] { background: var(--bad-soft); border-color: color-mix(in oklch, var(--bad) 45%, transparent); color: var(--bad); }
.read-follow { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
.read-more {
  position: absolute; bottom: calc(100% + 10px); right: 0; min-width: 230px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px;
  box-shadow: var(--shadow-lg); padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-3);
}
.read-more-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
.read-more-label { font-size: var(--fs-small); color: var(--ink-soft); flex: none; }
.read-hint {
  position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: var(--space-2); max-width: min(460px, 92vw);
  padding: 7px 7px 7px 14px; border-radius: 999px; font-size: var(--fs-small);
  background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent-deep); box-shadow: var(--shadow-md);
}
.read-ask {
  position: absolute; bottom: calc(100% + 10px); left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px;
  box-shadow: var(--shadow-lg); padding: var(--space-3) var(--space-4);
}
.read-ask-row { display: flex; align-items: center; gap: var(--space-3); }
.read-ask-live { flex: 1; min-width: 0; font-size: var(--fs-small); color: var(--ink-soft); }
.read-ask-pulse { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 99px; background: var(--bad-soft); color: var(--bad); animation: pulse-glow 1.3s ease-in-out infinite; }
.read-ask-scroll { max-height: min(48vh, 380px); overflow-y: auto; }
.read-ask-q { font-size: var(--fs-small); color: var(--ink-soft); font-style: italic; margin-bottom: var(--space-2); }
.read-ask-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); }

/* ============ DIAGNOSTICS LOG ============ */
.diag-log { border: 1px solid var(--line); border-radius: 12px; max-height: 52vh; overflow-y: auto; background: var(--paper); }
.diag-row { display: grid; grid-template-columns: auto auto 1fr; gap: var(--space-3); align-items: baseline; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: var(--fs-micro); }
.diag-row:last-child { border-bottom: none; }
.diag-row[data-level="error"] { background: var(--bad-soft); }
.diag-row[data-level="warn"] { background: var(--ochre-soft); }
.diag-time { color: var(--ink-faint); font-size: var(--fs-caption); white-space: nowrap; }
.diag-ev { color: var(--ink); font-weight: 600; white-space: nowrap; }
.diag-row[data-level="error"] .diag-ev { color: var(--bad); }
.diag-row[data-level="warn"] .diag-ev { color: var(--ochre-deep); }
.diag-detail { color: var(--ink-soft); word-break: break-word; }

/* offline banner (proactive backend-down warning) */
.offline-banner {
  display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
  padding: var(--space-3) var(--space-5); background: var(--bad-soft);
  border-bottom: 1px solid color-mix(in oklch, var(--bad) 35%, transparent);
  color: var(--bad); font-size: var(--fs-small); position: sticky; top: 0; z-index: 45;
}
</style>

<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
