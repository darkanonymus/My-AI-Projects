# Help me Learn — production stack: the app + Caddy (automatic HTTPS).
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
#
# Reads ../.env for OPENROUTER_API_KEY / ANTHROPIC_API_KEY and DOMAIN
# (e.g. DOMAIN=help-me-learn.duckdns.org). Caddy fetches a free Let's Encrypt
# certificate for DOMAIN automatically.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - hml-data:/data          # DB, voices, Whisper + Argos model caches (persisted)
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: ../.env           # provides $DOMAIN to the Caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  hml-data: {}
  caddy-data: {}
  caddy-config: {}
